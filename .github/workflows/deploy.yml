name: Verify and deploy metadata-cleaner

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npx --yes npm@12.2.0 ci
      - name: Audit runtime dependencies
        run: npx --yes npm@12.2.0 audit --omit=dev --audit-level=low
      - name: Check source and standards
        run: npx --yes npm@12.2.0 run check
      - name: Test metadata parsing and byte preservation
        run: npx --yes npm@12.2.0 test
      - name: Build publication folder
        run: npx --yes npm@12.2.0 run build
      - name: Install supported browsers
        run: npx --yes npm@12.2.0 exec playwright -- install --with-deps chromium firefox webkit
      - name: Check browser flows and responsive layout
        run: npx --yes npm@12.2.0 run test:browser
      - name: Check lab performance budgets
        if: runner.os == 'Linux'
        run: npx --yes npm@12.2.0 run test:performance
      - name: Keep verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ matrix.os }}
          path: |
            output/checks/
            output/responsive/
            output/playwright/
            output/lighthouse/
          retention-days: 14
          if-no-files-found: warn
      - name: Package checked Pages files
        if: runner.os == 'Linux' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy checked site
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
